
name: KTelecom Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine'

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build application
        run: cmake --build build --config Release

      - name: Prepare application folder
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/Release/KTelecom1.exe package/

      - name: Deploy Qt dependencies
        run: |
          windeployqt --release --compiler-runtime --dir package package/KTelecom1.exe

      - name: Create archive
        run: Compress-Archive -Path package/* -DestinationPath KTelecom-Windows.zip

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: KTelecom-Windows
          path: KTelecom-Windows.zip
